services:
  postgres_db:
    image: postgres:16-alpine
    container_name: ecommerce_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: shop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: ecommerce_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres_db

volumes:
  postgres_data:
